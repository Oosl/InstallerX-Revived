name: Automatic Alpha Pre-Release (Latest Only)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/auto-preview-release.yml'
  workflow_dispatch:

jobs:
  build_and_prerelease:
    if: |
      !contains(github.event.head_commit.message, 'chore: bump version') &&
      !contains(github.event.head_commit.message, 'chore(release)') &&
      !contains(github.event.head_commit.message, '[skip preview]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get commit short SHA & Date
        id: vars
        run: |
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          echo "YY_MM=$(date +'%y.%m')" >> $GITHUB_OUTPUT

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Accept the terms of use to suppress the caching licensing warning
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Main branch builds are allowed to update the cache
          cache-read-only: false
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Decode and set up signing key
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ]; then
            exit 0
          fi
          mkdir -p keystore
          echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
          echo "storeFile=keystore/carlyu.jks" > keystore.properties
          echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
          echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
          echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties

      - name: Build Preview Release APKs
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleOnlinePreviewRelease assembleOfflinePreviewRelease -PAPP_ID="${{ vars.APP_ID }}"

      - name: Find and Rename Preview APKs
        id: rename_apks
        run: |
          PROJECT_NAME="InstallerX-Revived"
          # Pure version tag e.g., 26.03.1a2b3c4
          VERSION_TAG="${{ steps.vars.outputs.YY_MM }}.${{ steps.vars.outputs.SHORT_SHA }}"

          ONLINE_APK_DIR="app/build/outputs/apk/onlinePreview/release/"
          OFFLINE_APK_DIR="app/build/outputs/apk/offlinePreview/release/"

          ONLINE_APK_PATH=$(find "$ONLINE_APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)
          OFFLINE_APK_PATH=$(find "$OFFLINE_APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1)

          if [ -z "$ONLINE_APK_PATH" ] || [ -z "$OFFLINE_APK_PATH" ]; then
            echo "ERROR: Could not find both APKs!"
            ls -R app/build/outputs/apk
            exit 1
          fi

          NEW_ONLINE_APK_NAME="${PROJECT_NAME}-online-${VERSION_TAG}.apk"
          NEW_OFFLINE_APK_NAME="${PROJECT_NAME}-offline-${VERSION_TAG}.apk"
          NEW_PACKAGE_INSTALLER_APK_NAME="Packageinstaller.apk"

          NEW_ONLINE_APK_PATH="${ONLINE_APK_DIR}${NEW_ONLINE_APK_NAME}"
          NEW_OFFLINE_APK_PATH="${OFFLINE_APK_DIR}${NEW_OFFLINE_APK_NAME}"
          NEW_PACKAGE_INSTALLER_APK_PATH="${ONLINE_APK_DIR}${NEW_PACKAGE_INSTALLER_APK_NAME}"

          mv "$ONLINE_APK_PATH" "$NEW_ONLINE_APK_PATH"
          mv "$OFFLINE_APK_PATH" "$NEW_OFFLINE_APK_PATH"
          cp "$NEW_ONLINE_APK_PATH" "$NEW_PACKAGE_INSTALLER_APK_PATH"

          echo "online_apk=${NEW_ONLINE_APK_PATH}" >> $GITHUB_OUTPUT
          echo "offline_apk=${NEW_OFFLINE_APK_PATH}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "package_installer_apk=${NEW_PACKAGE_INSTALLER_APK_PATH}" >> $GITHUB_OUTPUT

      - name: Replace APK in module and pack Magisk module
        id: pack_module
        run: |
          PACKAGE_INSTALLER_APK="${{ steps.rename_apks.outputs.package_installer_apk }}"
          MODULE_APK_PATH="module/system/priv-app/PackageInstaller/PackageInstaller.apk"
          cp "$PACKAGE_INSTALLER_APK" "$MODULE_APK_PATH"
          echo "Replaced $MODULE_APK_PATH with built APK"

          NEW_VERSION="${{ steps.rename_apks.outputs.version_tag }}"
          VERSION_CODE=$(date +%s)
          UPDATE_JSON_URL="https://raw.githubusercontent.com/${{ github.repository }}/main/update.json"

          sed -i "s/^version=.*/version=${NEW_VERSION}/" module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module/module.prop
          sed -i "/^updateJson=/d" module/module.prop
          echo "updateJson=${UPDATE_JSON_URL}" >> module/module.prop

          echo "Updated module.prop:"
          cat module/module.prop
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT

          MODULE_ZIP_NAME="InstallerX-Revived_COS-v${NEW_VERSION}.zip"
          cd module && zip -r "../${MODULE_ZIP_NAME}" . -x "*.git*"
          cd ..
          echo "module_zip=${MODULE_ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "Created ${MODULE_ZIP_NAME}"

      - name: Delete old preview release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Use regex to find tags ending with a hex hash of 7 or more characters
          # Stable tags like 26.03 or 26.03.01 will not match this regex
          LATEST_TAG=$(git tag --list --sort=-creatordate | grep -E '^[0-9]+\.[0-9]+\.[a-f0-9]{7,}$' | head -n 1)
          if [[ -n "$LATEST_TAG" ]]; then
            gh release delete "$LATEST_TAG" --yes || echo "No previous preview release found to delete."
            git push origin --delete "$LATEST_TAG" || echo "No previous preview tag found to delete."
          else
            echo "No preview tag to delete."
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Match pure number stable tags, ignoring those with hex hashes
          PREV_TAG=$(git tag --list | grep -E '^[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -Vr | head -n 1)
          CURR_TAG="${{ steps.rename_apks.outputs.version_tag }}"

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE=""
          else
            LOG_RANGE="$PREV_TAG..HEAD"
          fi

          CHANGELOG_LIST=$(git log $LOG_RANGE --pretty=format:"- %s (%an)" | grep -v '^-\s*Merge' | head -n 5)
          CHANGELOG_COUNT=$(git log $LOG_RANGE --pretty=format:"- %s (%an)" | grep -v '^-\s*Merge' | wc -l)

          CHANGELOG_BODY_OUTPUT=""
          if [ -z "$CHANGELOG_LIST" ]; then
            CHANGELOG_BODY_OUTPUT="No changes since the last stable release."
          else
            CHANGELOG_BODY_OUTPUT="$CHANGELOG_LIST"
          fi

          CHANGELOG_LINK_OUTPUT=""
          if [ "$CHANGELOG_COUNT" -gt 5 ]; then
            if [ -z "$PREV_TAG" ]; then
              COMPARE_URL="https://github.com/${{ github.repository }}/commits/main"
            else
              COMPARE_URL="https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${CURR_TAG}"
            fi
            CHANGELOG_LINK_OUTPUT="\n\n**Full Changelog:** [\`${PREV_TAG}...${CURR_TAG}\`]($COMPARE_URL)"
          fi

          {
            echo "changelog_body<<EOF"
            echo -e "$CHANGELOG_BODY_OUTPUT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          {
            echo "changelog_full_link<<EOF"
            echo -e "$CHANGELOG_LINK_OUTPUT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "--- Generated Changelog for Release Body ---"
          echo -e "${CHANGELOG_BODY_OUTPUT}${CHANGELOG_LINK_OUTPUT}"

      - name: Create Latest Preview Release
        uses: softprops/action-gh-release@v2
        with:
          name: "InstallerX Revived Preview (${{ steps.vars.outputs.SHORT_SHA }})"
          tag_name: "${{ steps.rename_apks.outputs.version_tag }}"
          target_commitish: ${{ github.sha }}
          body: |
            ## 这是自动构建的最新测试版。
            - **这是一个预发布版本，并非为生产环境准备就绪。**
            - 我们非常鼓励您分享您的看法！

            ## This is an automatically built latest Preview release.
            - **This is a pre-release version and is not intended for production use.**
            - We appreciate any feedback!

            **更新日志（Changelog）:**
            ${{ steps.changelog.outputs.changelog_body }}${{ steps.changelog.outputs.changelog_full_link }}
          prerelease: true
          files: |
            ${{ steps.rename_apks.outputs.online_apk }}
            ${{ steps.rename_apks.outputs.offline_apk }}
            ${{ steps.rename_apks.outputs.package_installer_apk }}
            ${{ steps.pack_module.outputs.module_zip }}

      - name: Generate update.json and sync to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          VERSION="${{ steps.rename_apks.outputs.version_tag }}"
          VERSION_CODE="${{ steps.pack_module.outputs.version_code }}"
          ZIP_NAME="${{ steps.pack_module.outputs.module_zip }}"
          TAG="${{ steps.rename_apks.outputs.version_tag }}"

          ZIP_URL="https://github.com/${REPO}/releases/download/${TAG}/${ZIP_NAME}"
          CHANGELOG_URL="https://raw.githubusercontent.com/${REPO}/main/changelog.md"

          cat > update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "${ZIP_URL}",
            "changelog": "${CHANGELOG_URL}"
          }
          EOF

          cat > changelog.md <<'CLEOF'
          ${{ steps.changelog.outputs.changelog_body }}
          CLEOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json changelog.md
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(release): update module update.json for ${VERSION} [skip ci]"
          git push origin HEAD:main

      # - name: Upload to Telegram
      #   env:
      #     API_ID: ${{ secrets.API_ID }}
      #     API_HASH: ${{ secrets.API_HASH }}
      #     BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      #     CHAT_ID: ${{ secrets.CHAT_ID }}
      #     BOT_CI_SESSION: ${{ secrets.BOT_CI_SESSION }}
      #   run: |
      #     pip3 install telethon
      #     python3 .github/bot.py "${{ steps.rename_apks.outputs.online_apk }}" "${{ steps.rename_apks.outputs.offline_apk }}" "${{ steps.rename_apks.outputs.package_installer_apk }}"